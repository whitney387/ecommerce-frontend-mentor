<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>e-commerce</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <nav
          class="navbar navbar-expand-lg"
          style="
            background-color: white;
            border-bottom: 1px solid rgba(110, 110, 110, 0.4);
          "
        >
          <div class="container-fluid">
            <a class="navbar-brand" href="#">
              <img src="../images/logo.svg" alt="logo" />
            </a>
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNavAltMarkup"
              aria-controls="navbarNavAltMarkup"
              aria-expanded="false"
              aria-label="Toggle navigation"
            >
              <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
              <div class="navbar-nav" style="font-size: 13 px">
                <a class="nav-link active" aria-current="page" href="#"
                  >Collections</a
                >
                <a class="nav-link" href="#">Men</a>
                <a class="nav-link" href="#">Women</a>
                <a class="nav-link" href="#">About</a>
                <a class="nav-link" href="#">Contact</a>
                <div
                  class="d-flex ms-auto gap-3"
                  style="justify-content: flex-end; padding-left: 90%"
                >
                  <a class="nav-link" href="#">
                    <img src="../images/icon-cart.svg" alt="icon-cart" />
                  </a>

                  <a class="nav-link ms-auto" href="#">
                    <img
                      src="../images/image-avatar.png"
                      alt="avatar"
                      width="35"
                    />
                  </a>
                </div>
              </div>
            </div>
          </div>
        </nav>
      </header>
      <main class="main">
        <div class="main-1">
          <img
            src="../images/image-product-1.jpg"
            alt="image-1"
            width="430px"
            class="image-1"
          />
          <div class="other">
            <img
              src="../images/image-product-1-thumbnail.jpg"
              alt="t-1"
              class="images imageee"
            />
            <img
              src="../images/image-product-2-thumbnail.jpg"
              alt="t-2"
              class="images"
            />
            <img
              src="../images/image-product-3-thumbnail.jpg"
              alt="t-3"
              class="images"
            />
            <img
              src="../images/image-product-4-thumbnail.jpg"
              alt="t-4"
              class="images"
            />
          </div>
        </div>
        <div class="main-2">
          <h1 class="heading">SNEAKER COMPANY</h1>
          <h2 class="heading-2">Fall limited Edition <br />sneakers</h2>
          <p class="par">
            These low-profile sneakers are your perfect casual wear<br />
            companion. Featuring a double rubber outer sole, they'll<br />
            withstand everything the weather can offer
          </p>
          <span class="price">$125.00</span>
          <span class="discount">50%</span>
          <div class="oprice">$250</div>
          <div class="cart-items">
            <span class="cont">
              <span class="remove">
                <img src="../images/icon-minus.svg" alt="remove" />
              </span>
              <span class="num">0</span>
              <span class="add"
                ><img src="../images/icon-plus.svg" alt="add"
              /></span>
            </span>
            <button class="button">
              <img src="../images/icon-cart.svg" alt="cart" width="18px" /> Add
              to cart
            </button>
          </div>
        </div>
      </main>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
